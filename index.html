<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Clever Cub">
<meta name="theme-color" content="#a5e3ff">
<meta name="description" content="Counting, letters, words and puzzles for little learners.">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap">
<title>Clever Cub</title>
<style>
:root{
  --ink:#1f2544; --muted:#64748b; --gold:#f59e0b; --good:#22c55e; --bad:#ef4444;
  --gc:#f97316;
  --font:'Andika', ui-rounded, 'Chalkboard SE', 'Comic Sans MS', system-ui, sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; height:100%; overflow:hidden; overscroll-behavior:none}
body{
  font-family:var(--font); color:var(--ink);
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; touch-action:manipulation;
  -webkit-text-size-adjust:100%;
  background:
    radial-gradient(130px 60px at 12% 10%, rgba(255,255,255,.8), transparent 70%),
    radial-gradient(170px 70px at 86% 18%, rgba(255,255,255,.7), transparent 70%),
    radial-gradient(220px 90px at 70% 94%, rgba(255,255,255,.55), transparent 70%),
    linear-gradient(180deg,#a5e3ff 0%,#d9f3ff 55%,#fff4c7 100%);
  background-color:#d9f3ff;
}
#app{position:fixed; inset:0; display:flex; flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 14px) calc(env(safe-area-inset-left) + 16px)}
button{font:inherit; color:inherit}
.btn{border:none; cursor:pointer; border-radius:24px; background:#fff; color:var(--ink);
  box-shadow:0 6px 0 rgba(0,0,0,.14); transition:transform .08s, box-shadow .08s, opacity .2s; touch-action:manipulation}
.btn:active{transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.14)}
.iconbtn{width:68px; height:68px; flex:none; font-size:34px; display:grid; place-items:center; border-radius:22px; padding:0}
.topbar{display:flex; align-items:center; gap:12px; min-height:70px; flex:none}
.spacer{flex:1}
.title{font-size:clamp(28px,4.4vmin,44px); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pill{display:inline-flex; align-items:center; gap:8px; background:#fff; border-radius:999px; padding:8px 18px;
  font-weight:700; font-size:clamp(22px,3.2vmin,32px); box-shadow:0 4px 0 rgba(0,0,0,.12); white-space:nowrap; flex:none}
.pill.bump{animation:bump .45s}
.logo{font-size:clamp(32px,5.2vmin,54px); font-weight:700; color:#ff7a1a; text-shadow:0 3px 0 #9a3412; letter-spacing:.5px; white-space:nowrap}
.greet{display:flex; align-items:center; gap:14px; margin:10px 0 14px; font-size:clamp(24px,3.6vmin,36px); font-weight:700; flex:none}
.greet .spacer{flex:1}
.rank{font-size:clamp(18px,2.6vmin,26px)}
.speak{width:clamp(66px,9.5vmin,86px); height:clamp(66px,9.5vmin,86px); flex:none; font-size:clamp(32px,5vmin,44px);
  border-radius:50%; display:grid; place-items:center; padding:0}
.speak.pulse{animation:pulse 1.1s ease-in-out 2}
body.nospeech .speak, body.nospeech .bigspeak{display:none}

/* splash */
.splash{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; min-height:0; overflow-y:auto}
.splash-lion{font-size:clamp(110px,24vmin,220px); line-height:1; animation:float 3s ease-in-out infinite}
.logo.big{font-size:clamp(56px,10vmin,104px); text-shadow:0 5px 0 #9a3412; margin:0; line-height:1.1}
.tag{font-size:clamp(24px,3.8vmin,36px); margin:0 0 8px; font-weight:700; color:#0f5b7a}
.playbtn{font-size:clamp(40px,7vmin,64px); font-weight:700; padding:18px 64px; border-radius:40px; background:#22c55e; color:#fff;
  box-shadow:0 9px 0 #15803d; animation:breathe 1.8s ease-in-out infinite}
.playbtn:active{box-shadow:0 3px 0 #15803d}
.namefield{display:flex; flex-direction:column; gap:6px; margin-top:12px; font-size:18px; color:var(--muted)}
.namefield input, .parents input, .parents select{font:inherit; font-size:20px; padding:10px 14px; border-radius:14px; border:2px solid #cbd5e1; background:#fff; color:var(--ink); -webkit-user-select:text; user-select:text}
.tip{font-size:17px; color:var(--muted); max-width:520px; margin:8px 0 0}

/* home */
.grid{flex:1; display:grid; grid-template-columns:repeat(3,1fr); grid-auto-rows:1fr; gap:clamp(14px,2.2vmin,24px); min-height:0}
@media (orientation:portrait){ .grid{grid-template-columns:repeat(2,1fr)} }
.tile{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; background:var(--c); color:#fff;
  border-radius:34px; box-shadow:0 8px 0 rgba(0,0,0,.2); padding:12px; min-height:0; position:relative; overflow:hidden}
.tile:active{box-shadow:0 3px 0 rgba(0,0,0,.2)}
.tile .ic{font-size:clamp(52px,9vmin,100px); line-height:1.05; filter:drop-shadow(0 4px 0 rgba(0,0,0,.15))}
.tile .nm{font-size:clamp(26px,4vmin,42px); font-weight:700; text-shadow:0 2px 0 rgba(0,0,0,.15)}
.tile .lv{background:#fff; color:var(--c); border-radius:999px; padding:4px 16px; font-weight:700; font-size:clamp(17px,2.5vmin,24px)}
.tile .bar{width:64%; height:12px; background:rgba(255,255,255,.35); border-radius:10px; overflow:hidden}
.tile .bar i{display:block; height:100%; background:#fff; border-radius:10px}
.homefoot{display:flex; align-items:center; gap:14px; margin-top:18px; flex:none}
.resume{flex:none; display:flex; align-items:center; gap:clamp(12px,2vmin,20px); width:100%; margin:0 0 clamp(12px,2vmin,18px); padding:clamp(8px,1.4vmin,14px) clamp(14px,2.4vmin,24px);
  background:#fff; border-radius:24px; border:4px solid var(--c); box-shadow:0 5px 0 rgba(0,0,0,.1); text-align:left; color:var(--ink)}
.resume:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.1)}
.resume .ic{font-size:clamp(36px,6vmin,58px); line-height:1}
.resume .rtxt{flex:1; display:flex; flex-direction:column; min-width:0}
.resume small{font-size:clamp(15px,2.2vmin,20px); color:var(--muted); font-weight:700}
.resume b{font-size:clamp(22px,3.4vmin,32px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.resume .go{flex:none; background:var(--c); color:#fff; font-weight:700; font-size:clamp(20px,3.2vmin,30px); padding:clamp(8px,1.4vmin,14px) clamp(16px,2.6vmin,26px); border-radius:18px; box-shadow:0 4px 0 rgba(0,0,0,.18)}
@media (orientation:landscape){ .resume{padding-block:5px; margin-bottom:12px; border-width:3px} .resume .ic{font-size:clamp(28px,4.6vmin,42px)}
  .resume .rtxt{flex-direction:row; align-items:baseline; gap:12px} .resume .go{padding-block:6px} }
.stickerbtn{flex:1; display:flex; align-items:center; justify-content:center; gap:14px; font-size:clamp(26px,4vmin,38px); font-weight:700;
  padding:16px; background:linear-gradient(135deg,#fde68a,#fbbf24); min-height:76px}
.stickerbtn .small{font-size:.7em; background:rgba(255,255,255,.7); border-radius:999px; padding:2px 12px}
.gear{position:relative; overflow:hidden; isolation:isolate; font-size:28px; width:60px; height:60px; opacity:.85}
.gear .ring{position:absolute; left:0; right:0; bottom:0; height:0; background:#fde68a; z-index:-1}
.gear.holding .ring{animation:fillup 2s linear forwards}

/* levels */
.levels{flex:1; display:grid; grid-template-columns:repeat(4,1fr); gap:clamp(12px,2vmin,22px); align-content:center; overflow-y:auto; padding:8px 4px 14px; min-height:0}
@media (orientation:portrait){ .levels{grid-template-columns:repeat(3,1fr)} }
.lvl{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:12px 8px; border-radius:28px; min-height:clamp(132px,20vmin,190px); position:relative}
.lvl .n{width:clamp(62px,10vmin,90px); height:clamp(62px,10vmin,90px); border-radius:50%; background:var(--gc); color:#fff;
  font-size:clamp(32px,5.4vmin,50px); font-weight:700; display:grid; place-items:center; box-shadow:inset 0 -5px 0 rgba(0,0,0,.15)}
.lvl .st{font-size:clamp(20px,3.2vmin,30px); letter-spacing:2px; line-height:1}
.st i{font-style:normal; color:#d4dbe5}
.st i.on{color:#f59e0b}
.lvl .d{font-size:clamp(14px,2vmin,18px); color:var(--muted); line-height:1.15; text-align:center}
.lvl.locked{opacity:.55}
.lvl.locked .n{background:#94a3b8; font-size:clamp(26px,4.4vmin,40px)}
.lvl.current{outline:6px solid var(--gold); animation:glow 1.6s ease-in-out infinite}
.lvl .me{position:absolute; top:-14px; right:-6px; font-size:clamp(32px,5vmin,46px); animation:float 2.4s ease-in-out infinite}

/* play */
.progress{flex:1; display:flex; gap:12px; justify-content:center; align-items:center}
.progress i{width:24px; height:24px; border-radius:50%; background:rgba(255,255,255,.6); border:3px solid #fff}
.progress i.done{background:var(--good)}
.progress i.now{background:#fff; box-shadow:0 0 0 4px var(--gc)}
.lvltag{font-size:clamp(22px,3.4vmin,32px); font-weight:700; color:var(--gc); background:#fff; border-radius:999px; padding:4px 18px}
.prompt{display:flex; align-items:center; gap:14px; margin:8px 0 6px; flex:none}
.mascot{font-size:clamp(50px,8vmin,78px); line-height:1; flex:none}
.mascot.jump{animation:jump .65s}
.mascot.sad{animation:wobble .5s}
.bubble{flex:1; background:#fff; border-radius:28px; padding:14px 24px; font-size:clamp(26px,4.2vmin,44px); font-weight:700; position:relative;
  box-shadow:0 5px 0 rgba(0,0,0,.1); min-height:clamp(66px,9.5vmin,86px); display:flex; align-items:center; line-height:1.15}
.bubble:before{content:''; position:absolute; left:-14px; top:50%; margin-top:-13px; border:13px solid transparent; border-right-color:#fff; border-left:0}
.hl{color:var(--gc); font-size:1.2em; padding:0 .1em}
.stage{flex:1; min-height:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; padding:6px 0}
.options{display:flex; gap:clamp(14px,2.4vmin,26px); justify-content:center; flex-wrap:wrap; padding:6px 0 10px; flex:none}
.options.fill{flex:1; align-items:center; align-content:center}
.opt{min-width:clamp(112px,18vmin,170px); min-height:clamp(112px,18vmin,170px); font-size:clamp(52px,9.5vmin,96px); font-weight:700;
  display:grid; place-items:center; padding:8px 18px; border:6px solid transparent; line-height:1}
.opt.word{font-size:clamp(40px,7vmin,68px); min-width:clamp(160px,25vmin,250px)}
.opt.emoji{font-size:clamp(60px,10.5vmin,104px)}
.opt.letter{font-size:clamp(62px,11vmin,108px)}
.opt.group{min-width:clamp(220px,40vw,440px); min-height:clamp(150px,26vmin,250px); font-size:16px; padding:14px}
.opt.good{background:#dcfce7; border-color:var(--good); animation:pop .45s}
.opt.bad{animation:shake .42s; opacity:.3}
.opt.dim{opacity:.45}
.shake{animation:shake .42s}

.things{display:grid; gap:clamp(4px,1vmin,12px); justify-content:center; align-content:center}
.things span{line-height:1.08; display:grid; place-items:center; position:relative}
.things.s-xl span{font-size:clamp(80px,17vmin,150px)}
.things.s-l span{font-size:clamp(64px,13vmin,118px)}
.things.s-m span{font-size:clamp(48px,9.5vmin,86px)}
.things.s-s span{font-size:clamp(34px,6.5vmin,60px)}
.things span.gone b{opacity:.28; font-weight:400}
.things span.gone:after{content:'✖'; position:absolute; inset:0; display:grid; place-items:center; color:var(--bad); font-size:.62em; font-family:system-ui}
.tens{display:flex; gap:clamp(14px,3vmin,34px); align-items:center}
.tens .things{background:rgba(255,255,255,.55); border-radius:20px; padding:8px}
.sum{display:flex; align-items:center; gap:clamp(10px,2.4vmin,28px)}
.sum .things{background:rgba(255,255,255,.55); border-radius:22px; padding:10px}
.op{font-size:clamp(50px,9vmin,90px); font-weight:700; color:var(--gc)}
.eq{font-size:clamp(36px,6.5vmin,62px); font-weight:700; background:#fff; border-radius:22px; padding:4px 26px}
.bigglyph{font-size:clamp(120px,25vmin,230px); font-weight:700; line-height:1; color:var(--gc); background:#fff; border-radius:40px; padding:6px 50px 14px; box-shadow:0 8px 0 rgba(0,0,0,.1)}
.bigpic{font-size:clamp(110px,22vmin,200px); line-height:1.05}
.bigword{font-size:clamp(70px,15vmin,140px); font-weight:700; background:#fff; border-radius:34px; padding:4px 46px 14px; box-shadow:0 8px 0 rgba(0,0,0,.1)}
.bigspeak{font-size:clamp(72px,14vmin,124px); width:clamp(160px,30vmin,250px); height:clamp(160px,30vmin,250px); border-radius:50%; display:grid; place-items:center; padding:0; animation:breathe 1.8s ease-in-out infinite}
.hint{font-size:clamp(18px,2.6vmin,24px); color:var(--muted); font-weight:700}
.seq{display:flex; gap:clamp(6px,1.3vmin,14px); --cell:min(112px, calc((100vw - 90px) / var(--n) - 14px), 18vmin)}
.seq span{width:var(--cell); height:var(--cell); background:#fff; border-radius:22px; display:grid; place-items:center; font-size:calc(var(--cell) * .6); font-weight:700; box-shadow:0 5px 0 rgba(0,0,0,.1); line-height:1}
.seq span.q{background:#fff7d6; outline:5px dashed var(--gold); outline-offset:-5px; color:var(--gold); animation:breathe 1.6s ease-in-out infinite}
.sentence{font-size:clamp(42px,8vmin,76px); font-weight:700; background:#fff; border-radius:32px; padding:14px 36px 20px; display:flex; align-items:center; gap:.28em; flex-wrap:wrap; justify-content:center; box-shadow:0 8px 0 rgba(0,0,0,.1)}
.blank{display:inline-grid; place-items:center; min-width:2em; border-bottom:7px dashed var(--gc); font-size:1.05em; line-height:1.15}

.tapgrid{display:grid; gap:clamp(10px,2vmin,20px); justify-content:center}
.tapitem{font-size:clamp(56px,10vmin,96px); width:clamp(96px,16vmin,150px); height:clamp(96px,16vmin,150px); display:grid; place-items:center; padding:0;
  background:rgba(255,255,255,.75); border:5px solid transparent; position:relative; line-height:1}
.tapitem.on{background:#fff7d6; border-color:var(--gold); animation:pop .3s}
.tapitem .badge{position:absolute; top:-12px; right:-12px; background:var(--gold); color:#fff; border-radius:50%; width:44px; height:44px;
  display:grid; place-items:center; font-size:26px; font-weight:700; box-shadow:0 3px 0 rgba(0,0,0,.15)}
.tapcount{font-size:clamp(48px,9vmin,84px); font-weight:700; color:var(--gc); background:#fff; border-radius:50%; width:clamp(90px,15vmin,130px); height:clamp(90px,15vmin,130px); display:grid; place-items:center; box-shadow:0 6px 0 rgba(0,0,0,.1)}

.slots{display:flex; gap:clamp(8px,1.6vmin,16px)}
.slot{width:clamp(78px,13vmin,116px); height:clamp(92px,15vmin,136px); border-radius:22px; background:#fff; border:5px dashed #cbd5e1;
  display:grid; place-items:center; font-size:clamp(56px,10vmin,92px); font-weight:700; line-height:1}
.slot.ghost{color:#d4dbe5}
.slot.filled{border-style:solid; border-color:var(--good); color:var(--ink); animation:pop .35s}
.tiles{display:flex; gap:clamp(12px,2vmin,20px); flex-wrap:wrap; justify-content:center}
.tilel{min-width:0; min-height:0; width:clamp(88px,14vmin,128px); height:clamp(88px,14vmin,128px); padding:0}
.tilel.used{visibility:hidden}

.board{display:grid; grid-template-columns:repeat(var(--cols,4), var(--cw,120px)); gap:12px; justify-content:center; align-content:center}
.card{width:var(--cw,120px); height:calc(var(--cw,120px) * 1.2); perspective:900px; cursor:pointer}
.card .in{position:relative; width:100%; height:100%; transition:transform .35s; transform-style:preserve-3d; -webkit-transform-style:preserve-3d}
.card.up .in, .card.matched .in{transform:rotateY(180deg)}
.card .f, .card .b{position:absolute; inset:0; border-radius:20px; display:grid; place-items:center; backface-visibility:hidden; -webkit-backface-visibility:hidden; box-shadow:0 6px 0 rgba(0,0,0,.15); line-height:1}
.card .b{background:repeating-linear-gradient(45deg,#ec4899 0 14px,#f472b6 14px 28px); font-size:calc(var(--cw,120px) * .38); border:5px solid #fff}
.card .f{background:#fff; transform:rotateY(180deg); font-size:calc(var(--cw,120px) * .55); font-weight:700}
.card .f.txt{font-size:calc(var(--cw,120px) * .55); color:#be185d}
.card .f.word{font-size:calc(var(--cw,120px) * .3); color:#1d4ed8}
.card.matched .f{background:#dcfce7; box-shadow:0 0 0 5px var(--good)}
.dots{display:grid; grid-template-columns:repeat(3,1fr); gap:2px; font-size:calc(var(--cw,120px) * .19); line-height:1}

/* overlay */
.overlay{position:fixed; inset:0; background:rgba(15,23,42,.45); display:grid; place-items:center; z-index:40; padding:20px}
.panel{background:#fff; border-radius:38px; padding:26px 36px 30px; text-align:center; max-width:640px; width:100%; box-shadow:0 14px 0 rgba(0,0,0,.15); animation:popin .4s}
.panel h2{font-size:clamp(34px,5.6vmin,52px); margin:6px 0}
.bigstars{font-size:clamp(70px,13vmin,116px); display:flex; justify-content:center; gap:10px; line-height:1.1}
.bigstars span{opacity:.18; filter:grayscale(1); transform:scale(.6); transition:all .4s cubic-bezier(.3,1.7,.5,1)}
.bigstars span.on{opacity:1; filter:none; transform:scale(1)}
.earn{font-size:clamp(28px,4.4vmin,40px); font-weight:700; color:#b45309}
.unlock, .rankup{font-size:clamp(22px,3.4vmin,30px); font-weight:700; margin-top:8px}
.rankup{color:#7c3aed}
.row{display:flex; gap:14px; justify-content:center; margin-top:20px; flex-wrap:wrap}
.bigbtn{font-size:clamp(26px,4.2vmin,36px); font-weight:700; padding:14px 30px; border-radius:26px; color:#fff; background:var(--good); box-shadow:0 6px 0 #15803d}
.bigbtn.alt{background:#e2e8f0; color:var(--ink); box-shadow:0 6px 0 #94a3b8}
.mystery, .reveal{font-size:clamp(120px,24vmin,200px); line-height:1.1}
.mystery{filter:brightness(0); opacity:.25}
.reveal{animation:spinin .8s cubic-bezier(.3,1.5,.5,1)}

/* stickers */
.book{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 4px 20px; min-height:0}
.book h3{font-size:clamp(26px,4vmin,36px); margin:16px 0 10px; display:flex; align-items:center; gap:12px}
.book h3 .price{font-size:.65em; background:#fff; border-radius:999px; padding:2px 14px; color:#b45309}
.stks{display:grid; grid-template-columns:repeat(5,1fr); gap:clamp(8px,1.5vmin,16px)}
@media (orientation:landscape){ .stks{grid-template-columns:repeat(10,1fr)} .stk .e{font-size:clamp(40px,6.8vmin,66px)} }
.stk{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:8px 2px; aspect-ratio:1; border-radius:22px; min-width:0}
.stk .e{font-size:clamp(50px,9vmin,86px); line-height:1.1}
.stk.locked .e{filter:brightness(0); opacity:.28}
.stk .p{font-size:clamp(15px,2.3vmin,21px); font-weight:700; color:#b45309}
.stk.own .p{color:var(--muted)}
.wiggle{animation:wiggle .6s}

/* parents */
.parents{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:4px 2px 30px; min-height:0; -webkit-user-select:text; user-select:text}
.card2{background:#fff; border-radius:24px; padding:16px 22px; margin:0 0 16px; box-shadow:0 4px 0 rgba(0,0,0,.08)}
.card2 h3{margin:4px 0 6px; font-size:24px}
.card2 p, .card2 li{font-size:18px; line-height:1.45}
.frow{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:12px 0; border-bottom:1px solid #eef2f7; font-size:20px}
.frow:last-child{border-bottom:none}
.frow small{display:block; color:var(--muted); font-size:15px; margin-top:2px}
.frow select{max-width:56%}
.tog{cursor:pointer}
.tog input{position:absolute; opacity:0; pointer-events:none; width:1px; height:1px}
.tog .sw{flex:none; width:62px; height:36px; border-radius:20px; background:#cbd5e1; position:relative; transition:background .2s}
.tog .sw:after{content:''; position:absolute; top:4px; left:4px; width:28px; height:28px; border-radius:50%; background:#fff; transition:transform .2s; box-shadow:0 2px 4px rgba(0,0,0,.2)}
.tog input:checked + .sw{background:var(--good)}
.tog input:checked + .sw:after{transform:translateX(26px)}
.smallbtn{font-size:19px; font-weight:700; padding:10px 18px; border-radius:16px; background:#e0f2fe; margin:8px 8px 0 0}
.smallbtn.danger{background:#fee2e2; color:#b91c1c}
.parents input.syncin{display:block; width:100%; box-sizing:border-box; font-size:17px; margin:6px 0 2px}
.prog{width:100%; border-collapse:collapse; font-size:18px}
.prog th, .prog td{text-align:left; padding:8px 6px; border-bottom:1px solid #eef2f7}
.prog th{color:var(--muted); font-size:15px}

.toast{position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 30px); transform:translateX(-50%); background:#1f2544; color:#fff; padding:12px 24px;
  border-radius:999px; font-size:20px; font-weight:700; z-index:70; animation:popin .3s; white-space:nowrap}
.coin, .flycoin{filter:sepia(1) saturate(2.6) hue-rotate(8deg) brightness(1.18)}
.coin{display:inline-block}
.flycoin{position:fixed; font-size:44px; z-index:50; pointer-events:none; transition:transform .65s cubic-bezier(.5,-0.4,.7,1), opacity .65s; line-height:1}
.confetti{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:60}
.confetti i{position:absolute; top:-24px; width:12px; height:18px; border-radius:3px; animation:fall linear forwards}

/* talking lion, challenge badges, grown-ups log */
.mascot span{display:inline-block}
body.is-talking .mascot span{animation:talk .28s ease-in-out infinite alternate}
body.is-talking .speak{box-shadow:0 0 0 7px rgba(245,158,11,.45), 0 6px 0 rgba(0,0,0,.14)}
.chal{font-size:clamp(18px,2.6vmin,26px); color:#c2410c}
.change{font-size:clamp(22px,3.4vmin,30px); font-weight:700; margin-top:8px; color:#ea580c}
.chgrp{display:inline-flex; align-items:center; gap:8px; white-space:nowrap}

.days b{color:var(--ink); font-size:13px; font-weight:700}
.scrollx{overflow-x:auto; -webkit-overflow-scrolling:touch}
.prog.small{font-size:15px}
.prog.small td, .prog.small th{padding:6px 5px; white-space:nowrap}
.note{font-size:15px; color:var(--muted); line-height:1.4}

function ad(id){ return S.adapt[id] || (S.adapt[id] = {b:0, recent:[]}); }

const byB = (b, arr) => arr[Math.max(-1, Math.min(2, b)) + 1];   // arr lists values for challenge -1, 0, 1, 2
function adaptAfterLevel(p){
  const a = ad(p.gameId), g = GAME[p.gameId];
  if (!S.settings.adaptive) return '';
  const r = a.recent, need = g.kind === 'memory' ? ADAPT.needMemory : ADAPT.need;
  if (r.length < need) return '';
  const acc = r.filter(x => x.ok).length / r.length, fast = r.filter(x => x.fast).length / r.length;
  let change = '';
  if (acc >= ADAPT.upAcc && fast >= ADAPT.upFast){
    if (a.b < ADAPT.max){ a.b++; change = 'up'; }
    else { const st = gs(p.gameId); if (p.lvl + 2 <= g.levels.length && st.unlocked < p.lvl + 2){ st.unlocked = p.lvl + 2; change = 'skip'; } }
    a.recent = [];
  } else if (acc < ADAPT.downAcc){
    if (a.b > ADAPT.min){ a.b--; change = 'down'; }
    a.recent = [];
  }
  return change;
}

// ---------- sound effects (made in the browser, no files) ----------
const Sound = {
  ctx:null,
  unlock(){ try { if (!this.ctx){ const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; this.ctx = new AC(); } if (this.ctx.state !== 'running') this.ctx.resume(); } catch(e) {} },
  note(f, t0, dur, type='triangle', vol=.18){
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0+.015); g.gain.exponentialRampToValueAtTime(.0001, t0+dur);
    o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0+dur+.05);
  },
  slide(f1, f2, t0, dur, type='sine', vol=.15){
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t0); o.frequency.exponentialRampToValueAtTime(f2, t0+dur);
    g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0+.02); g.gain.exponentialRampToValueAtTime(.0001, t0+dur);
    o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0+dur+.05);
  },
  play(name){
    if (QUIET || !S.settings.sfx) return; this.unlock(); const c = this.ctx; if (!c) return;
    const t = c.currentTime + .01;
    try {
      switch (name){
        case 'tap': this.note(660, t, .08, 'triangle', .12); break;
        case 'good': [523.25,659.25,783.99].forEach((f,i) => this.note(f, t+i*.09, .24)); break;
        case 'bad': this.slide(300, 190, t, .3, 'sine', .14); break;
        case 'coin': this.note(987.77, t, .08, 'square', .05); this.note(1318.5, t+.08, .28, 'square', .05); break;
        case 'flip': this.slide(500, 820, t, .09, 'triangle', .1); break;
        case 'pop': this.slide(420, 900, t, .12, 'sine', .13); break;
        case 'star': this.note(1046.5, t, .25, 'triangle', .15); this.note(1568, t+.06, .3, 'sine', .08); break;
        case 'level': [523.25,659.25,783.99,1046.5].forEach((f,i) => this.note(f, t+i*.12, i===3 ? .7 : .22)); break;
        case 'buy': [784,988,1175,1568].forEach((f,i) => this.note(f, t+i*.07, .28, 'sine', .14)); break;
        case 'harder': [392,523.25,659.25,880,1046.5].forEach((f,i) => this.note(f, t+i*.08, .25, 'triangle', .14)); break;
      }
    } catch(e) {}
  }
};

// ---------- talking ----------
// 1) A recorded voice pack (voice/manifest.json + clips) is used when every line of a sentence is in it.
// 2) Otherwise the iPad's own voice, with livelier pitch and speed for cheers.
const STYLE = {q:{rate:1, pitch:1.12}, info:{rate:1, pitch:1.12}, cheer:{rate:1.08, pitch:1.34}, big:{rate:1.05, pitch:1.4},
  try:{rate:1, pitch:1.2}, count:{rate:1.06, pitch:1.1}, letter:{rate:1, pitch:1.16}};
const NOVELTY = /^(albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|fred|junior|kathy|ralph|eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley)\b/i;
function talking(on){ document.body.classList.toggle('is-talking', !!on); }

const Pack = {
  ok:false, map:{}, meta:null, cache:new Map(), sources:[],
  norm: s => String(s).trim().toLowerCase().replace(/\s+/g, ' '),
  async load(){
    if (QUIET) return;
    try {
      const r = await fetch('voice/manifest.json', {cache:'no-cache'}); if (!r.ok) return;
      const m = await r.json(); if (!m || !m.clips) return;
      this.map = {}; for (const [k, v] of Object.entries(m.clips)) this.map[this.norm(k)] = v;
      this.meta = m; this.ok = Object.keys(this.map).length > 0;
    } catch(e) {}
  },
  active(){ return this.ok && S.settings.pack !== false && !!Sound.ctx; },
  has(parts){ return this.active() && parts.every(p => this.map[this.norm(p)]); },
  get(p){
    const file = this.map[this.norm(p)]; if (!file) return Promise.reject(new Error('no clip'));
    if (!this.cache.has(file)){
      const prom = fetch('voice/' + file).then(r => { if (!r.ok) throw new Error('clip ' + r.status); return r.arrayBuffer(); })
        .then(ab => new Promise((res, rej) => Sound.ctx.decodeAudioData(ab, res, rej)));
      prom.catch(() => this.cache.delete(file));
      this.cache.set(file, prom);
    }
    return this.cache.get(file);
  },
  preload(parts){ if (!this.active()) return; [].concat(parts || []).forEach(p => { if (this.map[this.norm(p)]) this.get(p).catch(() => {}); }); },
  async play(parts, token){
    Sound.unlock(); const ctx = Sound.ctx;
    const bufs = await Promise.all(parts.map(p => this.get(p)));
    if (token !== Voice.token) return;
    let t = ctx.currentTime + .04;
    talking(true);
    for (const b of bufs){ const s = ctx.createBufferSource(); s.buffer = b; s.connect(ctx.destination); s.start(t); this.sources.push(s); t += b.duration + .14; }
    setTimeout(() => { if (token === Voice.token) talking(false); }, (t - ctx.currentTime) * 1000);
  },
  stopAll(){ this.sources.forEach(s => { try { s.stop(); } catch(e) {} }); this.sources = []; }
};

const Voice = {
  ok: ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window),
  list:[], v:null, unlocked:false, token:0,
  init(){
    if (!this.ok) { document.body.classList.add('nospeech'); return; }
    const loadV = () => { try { this.list = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang)); } catch(e) { this.list = []; } this.choose(); };
    loadV();
    try { speechSynthesis.addEventListener('voiceschanged', loadV); } catch(e) { speechSynthesis.onvoiceschanged = loadV; }
  },
  score(v){
    const n = v.name, lang = v.lang.replace('_','-').toLowerCase();
    let s = {'en-za':30, 'en-gb':26, 'en-au':22, 'en-ie':20, 'en-nz':20, 'en-us':16}[lang] || 5;
    if (/premium/i.test(n)) s += 100; else if (/enhanced|natural|neural/i.test(n)) s += 70;
    if (/samantha|karen|moira|tessa|serena|kate|ava|zoe|evan|nicky|allison|susan|catherine|martha|stephanie/i.test(n)) s += 12;
    if (NOVELTY.test(n)) s -= 200;
    if (/google/i.test(n)) s += 8;
    return s;
  },
  choose(){
    const L = this.list; let v = null;
    if (S.settings.voiceURI) v = L.find(x => x.voiceURI === S.settings.voiceURI);
    if (!v && L.length) v = L.slice().sort((a,b) => this.score(b) - this.score(a))[0];
    this.v = v || null;
  },
  say(parts, {kind='info', force=false, pitch=null} = {}){
    if (QUIET) return;
    parts = [].concat(parts || []).filter(Boolean);
    if (!parts.length) return;
    if (!force && !S.settings.voice) return;
    const busy = this.ok && (speechSynthesis.speaking || speechSynthesis.pending);
    this.stop();
    const token = ++this.token;
    if (Pack.has(parts)){ Pack.play(parts, token).catch(() => { if (token === this.token) this.device(parts, kind, pitch, token, false); }); return; }
    this.device(parts, kind, pitch, token, busy);
  },
  device(parts, kind, pitch, token, busy){
    if (!this.ok) return;
    const st = S.settings.lively ? (STYLE[kind] || STYLE.info) : {rate:1, pitch:1};
    const go = () => {
      if (token !== this.token) return;
      parts.forEach((p, i) => {
        try {
          const u = new SpeechSynthesisUtterance(p);
          if (this.v){ u.voice = this.v; u.lang = this.v.lang; } else u.lang = 'en-ZA';
          u.rate = Math.min(1.4, (+S.settings.rate || .9) * st.rate);
          u.pitch = Math.min(2, pitch || st.pitch);
          if (i === 0) u.onstart = () => { if (token === this.token) talking(true); };
          if (i === parts.length - 1) u.onend = u.onerror = () => { if (token === this.token) talking(false); };
          speechSynthesis.speak(u);
        } catch(e) {}
      });
    };
    if (busy) setTimeout(go, 80); else go();
  },
  stop(){ this.token++; try { if (this.ok) speechSynthesis.cancel(); } catch(e) {} Pack.stopAll(); talking(false); },
  unlock(){ if (!this.ok || this.unlocked || QUIET) return; this.unlocked = true; try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch(e) {} }
};
// A name can only be spoken by the iPad voice, so recorded packs use the name-free lines
const named = () => (Pack.active() ? '' : S.settings.name.trim());
const praise = () => { const n = named(); return (n && Math.random() < .3) ? `Well done, ${n}!` : pick(PRAISE); };

// ---------- little HTML builders ----------
function thingsGrid(e, n, cols, sz, gone=0){
  let h = '';
  for (let i=0; i<n; i++) h += (i >= n-gone) ? `<span class="gone"><b>${e}</b></span>` : `<span>${e}</span>`;
  return `<div class="things s-${sz}" style="grid-template-columns:repeat(${cols},auto)">${h}</div>`;
}
function groupHTML(e, n, opt={}){
  const sz = opt.size || (n<=3 ? 'xl' : n<=5 ? 'l' : n<=10 ? 'm' : 's');
  if (n > 10) return `<div class="tens">${thingsGrid(e,10,5,sz)}${thingsGrid(e,n-10,5,sz)}</div>`;
  return thingsGrid(e, n, n<=5 ? n : 5, sz, opt.gone||0);
}
const seqHTML = (items, hide) => `<div class="seq" style="--n:${items.length}">${items.map((x,i) => i===hide ? '<span class="q">?</span>' : `<span>${x}</span>`).join('')}</div>`;
const speakerHTML = () => `<button class="btn bigspeak" data-act="speak" aria-label="Listen again">🔊</button><div class="hint">Tap to listen again</div>`;
const starsHTML = s => [1,2,3].map(i => `<i class="${i<=s ? 'on' : ''}">★</i>`).join('');
function dotsHTML(e, k){ return `<div class="dots">${Array.from({length:k}, () => `<span>${e}</span>`).join('')}</div>`; }

// ---------- question makers ----------
// say and cheer are lists of short lines (a recorded voice pack has one clip per line)
function choiceQ(o){ return Object.assign({type:'choice', stage:'', optCls:'', listen:false}, o); }
function numOptions(ans, n, lo, hi){
  const set = [ans];
  for (const c of shuffle([1,-1,2,-2,3,-3,4,-4].map(d => ans+d))) { if (set.length >= n) break; if (c>=lo && c<=hi && !set.includes(c)) set.push(c); }
  for (let x=lo; set.length<n; x++) if (!set.includes(x)) set.push(x);
  return shuffle(set);
}
const numOpts = (ans,n,lo,hi) => numOptions(ans,n,lo,hi).map(v => ({html:String(v), value:v}));

// counting
function qCount(min, max, n=3){
  const t = pick(THINGS), k = min + rnd(max-min+1);
  return choiceQ({key:`count${k}${t.e}`, text:`How many ${t.many}?`, say:[`How many ${t.many}?`], stage:groupHTML(t.e,k),
    options:numOpts(k, n, Math.max(1,min-1), max+2), answer:k, optCls:'num', cheer:[`${N(k)}!`]});
}
function qTap(min, max){
  max = Math.min(max, 10); min = Math.min(min, max);
  const t = pick(THINGS), k = min + rnd(max-min+1), total = Math.min(k+1+rnd(3), 12), nm = k===1 ? t.one : t.many;
  return {type:'tap', key:`tap${k}${t.e}`, text:`Tap <span class="hl">${k}</span> ${nm}`, say:[`Tap ${sayN(k)} ${nm}.`], emoji:t.e, total, target:k, cheer:[`${N(k)}!`, PHRASES.goodCount]};
}
function qNext(max, n=3){
  const s = 1 + rnd(max-3), seq = [s,s+1,s+2,s+3], h = pick([1,2,3,3]), ans = seq[h];
  const t = h===3 ? 'What number comes next?' : 'Which number is missing?';
  return choiceQ({key:`next${s}-${h}`, text:t, say:[t], stage:seqHTML(seq.map(String),h), options:numOpts(ans,n,1,max+1), answer:ans, optCls:'num', cheer:[`${N(ans)}!`]});
}
function qMore(minDiff, max, word){
  max = Math.min(max, 10);
  const t = pick(THINGS); let a, b;
  do { a = 1+rnd(max); b = 1+rnd(max); } while (Math.abs(a-b) < minDiff);
  const ans = word==='more' ? (a>b ? 'L' : 'R') : (a<b ? 'L' : 'R'), big = Math.max(a,b), sz = big<=5 ? 'm' : 's';
  return choiceQ({key:`more${a}-${b}${word}`, text:`Which side has <span class="hl">${word}</span>?`, say:[`Which side has ${word} ${t.many}?`],
    options:[{html:groupHTML(t.e,a,{size:sz}), value:'L'}, {html:groupHTML(t.e,b,{size:sz}), value:'R'}], answer:ans, optCls:'group', fixed:true,
    cheer:[word==='more' ? PHRASES.moreYes : PHRASES.lessYes]});
}
function qAdd(maxSum, n=3){
  const t = pick(THINGS), a = 1+rnd(Math.min(10, maxSum-1)), b = 1+rnd(Math.min(10, maxSum-a)), s = a+b, sz = s<=5 ? 'l' : 's';
  return choiceQ({key:`add${a}+${b}${t.e}`, text:'How many altogether?', say:[`${N(a)} plus ${sayN(b)}.`, PHRASES.howMany],
    stage:`<div class="sum">${groupHTML(t.e,a,{size:sz})}<span class="op">+</span>${groupHTML(t.e,b,{size:sz})}</div><div class="eq">${a} + ${b} = ?</div>`,
    options:numOpts(s,n,2,maxSum+2), answer:s, optCls:'num', cheer:[`${N(a)} and ${sayN(b)} make ${sayN(s)}!`]});
}
function qTake(maxN, n=3){
  maxN = Math.min(maxN, 10);
  const th = pick(TAKE), tot = 3+rnd(maxN-2), k = 1+rnd(tot-1), left = tot-k;
  const verb = k===1 ? `${th.one} ${th.v1}` : `${th.many} ${th.v}`;
  return choiceQ({key:`take${tot}-${k}${th.e}`, text:`${k} ${verb}. How many are left?`, say:[`${N(tot)} ${th.many}.`, `${N(k)} ${k===1 ? th.v1 : th.v}.`, PHRASES.left],
    stage:groupHTML(th.e, tot, {gone:k, size:tot<=5 ? 'l' : 'm'}), options:numOpts(left,n,0,tot), answer:left, optCls:'num', cheer:[`${N(left)} left!`]});
}
function qFindNumber(lo, hi, n=4){
  const ans = lo + rnd(hi-lo+1);
  if (!Voice.ok) return choiceQ({key:`fn${ans}`, text:`Find <span class="hl">${ans}</span>`, say:[`Find the number ${sayN(ans)}.`], options:numOpts(ans,n,lo,hi), answer:ans, optCls:'num', cheer:[`${N(ans)}!`]});
  return choiceQ({key:`fn${ans}`, listen:true, text:'Listen! Find the number.', say:[`Find the number ${sayN(ans)}.`], stage:speakerHTML(), options:numOpts(ans,n,lo,hi), answer:ans, optCls:'num', cheer:[`${N(ans)}!`]});
}
function qCountBack(max=10, n=3){
  const s = 4+rnd(max-3), seq = [s,s-1,s-2,s-3];
  return choiceQ({key:`cb${s}`, text:'Count back. What comes next?', say:[`${seq.slice(0,3).map(N).join(', ')}...`, PHRASES.whatNext],
    stage:seqHTML(seq.map(String),3), options:numOpts(s-3,n,0,max), answer:s-3, optCls:'num', cheer:[`${N(s-3)}!`]});
}

// letters
function letterOpts(ans, n, pool, confuse){
  let others = (confuse && CONFUSE[ans]) ? sample(CONFUSE[ans], n-1) : sample(pool.filter(x => x!==ans), n-1);
  return shuffle([ans, ...others]).map(v => ({html:v, value:v}));
}
function qFindLetter(pool, lower, n){
  const L = pick(pool), ans = lower ? L.toLowerCase() : L.toUpperCase();
  return choiceQ({key:`fl${ans}`, text:'Find the same letter', say:[`Find the ${lower ? 'small ' : ''}letter ${sayL(ans)}.`], stage:`<div class="bigglyph">${ans}</div>`,
    options:letterOpts(ans, n, lower ? LO : UP, false), answer:ans, optCls:'letter', cheer:[`${sayL(ans)}!`]});
}
function qListenLetter(pool, lower, n, confuse){
  if (!Voice.ok) return qFindLetter(pool, lower, n);
  const L = pick(pool), ans = lower ? L.toLowerCase() : L.toUpperCase();
  return choiceQ({key:`ll${ans}`, listen:true, text:'Listen! Which letter?', say:[`Find the letter ${sayL(ans)}.`], stage:speakerHTML(),
    options:letterOpts(ans, n, lower ? LO : UP, confuse), answer:ans, optCls:'letter', cheer:[`${sayL(ans)}!`]});
}
function qBigSmall(confuse, n){
  const l = confuse ? pick(TRICKY) : pick(LO), U = l.toUpperCase();
  return choiceQ({key:`bs${l}`, text:'Find the small letter', say:[`Find the small letter that goes with big ${sayL(U)}.`], stage:`<div class="bigglyph">${U}</div>`,
    options:letterOpts(l, n, LO, confuse), answer:l, optCls:'letter', cheer:[`Big ${sayL(U)}, small ${sayL(U)}!`]});
}
function qStartsWith(n){
  const l = pick(START_LETTERS), ans = pick(BY_LETTER[l]);
  const opts = shuffle([ans, ...sample(START_WORDS.filter(w => soundOf(w[0]) !== soundOf(l)), n-1)]);
  return choiceQ({key:`sw${ans}`, text:`Which one starts with <span class="hl">${l.toUpperCase()}${l}</span>?`, say:[`Which picture starts with ${sayL(l)}?`, ...opts],
    options:opts.map(w => ({html:PICS[w], value:w})), answer:ans, optCls:'emoji', cheer:[`${cap(ans)} starts with ${sayL(l)}!`]});
}
function qFirstLetter(n){
  const w = pick(START_WORDS), l = w[0];
  const ok = c => soundOf(c) !== soundOf(l);
  const tricky = CONFUSE[l] ? sample(CONFUSE[l].filter(ok), 1) : [];
  const rest = sample(LO.filter(c => ok(c) && !tricky.includes(c)), n-1-tricky.length);
  const opts = shuffle([l, ...tricky, ...rest]);
  return choiceQ({key:`first${w}`, text:'What letter does it start with?', say:[`${cap(w)}.`, `What letter does ${w} start with?`], stage:`<div class="bigpic">${PICS[w]}</div>`,
    options:opts.map(c => ({html:c, value:c})), answer:l, optCls:'letter', cheer:[`${cap(w)} starts with ${sayL(l)}!`]});
}
function qAlphaNext(lower, n=3){
  const s = rnd(23), seq = UP.slice(s, s+4).map(c => lower ? c.toLowerCase() : c), ans = seq[3];
  const opts = shuffle([ans, ...sample((lower ? LO : UP).filter(c => !seq.includes(c)), n-1)]);
  return choiceQ({key:`an${s}${lower ? 'l' : 'u'}`, text:'What letter comes next?', say:[`${seq.slice(0,3).map(sayL).join(', ')}...`, PHRASES.whatNext],
    stage:seqHTML(seq,3), options:opts.map(c => ({html:c, value:c})), answer:ans, optCls:'letter', cheer:[`${sayL(ans)}!`]});
}

// words
function wordOpts(ans, n, list, near){
  let others = (near && NEAR[ans]) ? sample(NEAR[ans], n-1) : sample(list.filter(w => w!==ans && w[0]!==ans[0]), n-1);
  if (others.length < n-1) others = others.concat(sample(list.filter(w => w!==ans && !others.includes(w)), n-1-others.length));
  return shuffle([ans, ...others]).map(w => ({html:w, value:w}));
}
function qPicWord(list, n, near){
  const w = pick(list);
  return choiceQ({key:`pw${w}`, text:'Which word is this?', say:['Which word matches the picture?'], stage:`<div class="bigpic">${PICS[w]}</div>`,
    options:wordOpts(w, n, list, near), answer:w, optCls:'word', cheer:[`${cap(w)}!`]});
}
function qWordPic(list, n){
  const w = pick(list), opts = shuffle([w, ...sample(list.filter(x => x!==w), n-1)]);
  return choiceQ({key:`wp${w}`, text:'Read the word. Find the picture.', say:['Read the word. Then find the picture.'], stage:`<div class="bigword">${w}</div>`,
    options:opts.map(x => ({html:PICS[x], value:x})), answer:w, optCls:'emoji', cheer:[`${cap(w)}!`]});
}
function qListenWord(list, n, similar){
  const w = pick(list); let pool = list.filter(x => x!==w);
  if (similar){ const sim = SIGHT_ALL.filter(x => x!==w && (x[0].toLowerCase()===w[0].toLowerCase() || x.length===w.length)); if (sim.length >= n-1) pool = sim; }
  const opts = shuffle([w, ...sample(pool, n-1)]).map(x => ({html:x, value:x}));
  if (!Voice.ok) return choiceQ({key:`lw${w}`, text:`Find <span class="hl">${w}</span>`, say:[`Find the word: ${w}.`], options:opts, answer:w, optCls:'word', cheer:[`That says ${w}!`]});
  return choiceQ({key:`lw${w}`, listen:true, text:'Listen! Find the word.', say:[`Find the word: ${w}.`], stage:speakerHTML(), options:opts, answer:w, optCls:'word', cheer:[`That says ${w}!`]});
}
function qRhyme(pics, n=3){
  const g = pick(RHYMES), [t, a] = sample(g, 2);
  const opts = shuffle([a, ...sample(RHYMES.filter(x => x!==g).flat(), n-1)]);
  const cheer = [`${cap(t)}, ${a}.`, PHRASES.rhyme];
  if (pics) return choiceQ({key:`rh${t}${a}`, text:`What rhymes with <span class="hl">${t}</span>?`, say:[`Which one rhymes with ${t}?`, ...opts],
    stage:`<div class="bigpic">${PICS[t]}</div>`, options:opts.map(x => ({html:PICS[x], value:x})), answer:a, optCls:'emoji', cheer});
  return choiceQ({key:`rhw${t}${a}`, text:`Which word rhymes with <span class="hl">${t}</span>?`, say:[`Which word rhymes with ${t}?`],
    stage:`<div class="bigpic">${PICS[t]}</div>`, options:opts.map(x => ({html:x, value:x})), answer:a, optCls:'word', cheer});
}
function qSentence(n=3, list=EASY3.concat(WORD4)){
  const w = pick(list), s = pick(SENTS), [pre, post] = s.split('{w}');
  return choiceQ({key:`se${w}${s}`, text:'Which word fits in the gap?', say:['Read the sentence. Which word fits in the gap?'],
    stage:`<div class="sentence">${pre}<span class="blank">${PICS[w]}</span>${post}</div>`, options:wordOpts(w, n, list, false), answer:w, optCls:'word', cheer:[s.replace('{w}', w)]});
}

// patterns
function qPattern(unit, setName, mid, extra=1){
  const setKey = setName || pick(PICTURE_SETS), set = PSETS[setKey];
  const letters = [...new Set(unit.split(''))], syms = sample(set, letters.length), map = {};
  letters.forEach((l,i) => map[l] = syms[i]);
  const len = unit.length===2 ? 6 : unit.length===3 ? 7 : 9;
  const seq = Array.from({length:len}, (_,i) => map[unit[i % unit.length]]);
  const hide = mid ? unit.length + rnd(len-1-unit.length) : len-1, ans = seq[hide];
  const opts = shuffle([...syms, ...sample(set.filter(x => !syms.includes(x)), extra)]);
  const t = mid ? 'What is missing?' : 'What comes next?';
  return choiceQ({key:`pat${unit}${syms.join('')}${hide}`, text:t, say:[`Look at the pattern. ${t}`], stage:seqHTML(seq, hide),
    options:opts.map(x => ({html:x, value:x})), answer:ans, optCls:setKey==='numbers' ? 'num' : 'emoji', cheer:[pick(PATTERN_CHEERS)]});
}
function qOdd(count=4){
  const [a, b] = shuffle(pick(ODD_SIMILAR)), pos = rnd(count), items = Array(count).fill(a); items[pos] = b;
  return choiceQ({key:`odd${a}${b}${pos}${count}`, text:'Which one is different?', say:['Which one is different?'], options:items.map((x,i) => ({html:x, value:i})),
    answer:pos, optCls:'emoji', fixed:true, cheer:[PHRASES.spotted]});
}
function qOddCat(count=4){
  let A, B;
  do { [A, B] = sample(CATS, 2); } while ([A.name, B.name].includes('fruit') && [A.name, B.name].includes('sweet treats'));
  const items = sample(A.items, Math.min(count-1, A.items.length)), pos = rnd(items.length+1); items.splice(pos, 0, pick(B.items));
  return choiceQ({key:`oc${items.join('')}`, text:'Which one does not belong?', say:['Which one does not belong?'], options:items.map((x,i) => ({html:x, value:i})),
    answer:pos, optCls:'emoji', fixed:true, cheer:[`Yes! The others are all ${A.name}.`]});
}

// spelling
function qSpell(cfg, b=0){
  const extra = Math.max(0, cfg.extra + b), ghost = cfg.ghost && b < 1;
  const w = pick(cfg.list), pool = 'abcdefghijklmnoprstuvwyz'.split('').filter(c => !w.includes(c));
  const letters = w.split('').concat(sample(pool, extra));
  let mixed = shuffle(letters), tries = 0;
  while (mixed.join('').startsWith(w) && tries++ < 12) mixed = shuffle(letters);
  return {type:'spell', key:`sp${w}`, word:w, emoji:PICS[w], ghost, extra, letters:mixed,
    text:ghost ? 'Copy the word' : 'Spell the word', say:[`Can you spell ${w}?`], cheer:[`${cap(w)}!`]};
}

// memory
function makeMemory(L, b=0){
  const kindMax = {pics:10, letters:10, case:10, numdots:9, wordpic:10};
  const n = Math.max(2, Math.min(kindMax[L.kind], L.pairs + b)); let pairs = [];
  switch (L.kind){
    case 'pics': pairs = sample(MEM_PICS, n).map(e => ({a:{h:e,c:'emo'}, b:{h:e,c:'emo'}, say:PHRASES.match})); break;
    case 'letters': pairs = sample(UP, n).map(l => ({a:{h:l,c:'txt'}, b:{h:l,c:'txt'}, say:`${sayL(l)}!`})); break;
    case 'case': pairs = sample(UP.filter(l => !'CKOPSUVWXZ'.includes(l)), n).map(l => ({a:{h:l,c:'txt'}, b:{h:l.toLowerCase(),c:'txt'}, say:`Big ${sayL(l)}, small ${sayL(l)}!`})); break;
    case 'numdots': { const dot = pick(['🔵','🍎','⭐','🐞']); pairs = sample(range(1, n>6 ? 9 : 6), n).map(k => ({a:{h:String(k),c:'txt'}, b:{h:dotsHTML(dot,k),c:'dots'}, say:`${N(k)}!`})); break; }
    case 'wordpic': pairs = sample(EASY3_CLEAR, n).map(w => ({a:{h:w,c:'word'}, b:{h:PICS[w],c:'emo'}, say:`${cap(w)}!`})); break;
  }
  const cards = [];
  pairs.forEach((p,i) => { cards.push({...p.a, id:i, say:p.say}); cards.push({...p.b, id:i, say:p.say}); });
  return {cards:shuffle(cards), pairs:n, kind:L.kind};
}

// ---------- playing a level ----------
function buildQuestions(g, L, b){
  const seen = new Set(), qs = [];
  for (let i=0; i<5; i++){
    let q, tries = 0;
    do { q = g.kind==='spell' ? qSpell(L, b) : L.gen(b); tries++; } while (seen.has(q.key) && tries < 40);
    seen.add(q.key); qs.push(q);
  }
  return qs;
}
function startLevel(gid, n){
  const g = GAME[gid]; if (!g || n < 1 || n > g.levels.length) return showLevels(gid);
  leaveLevel(); closeOverlay(); curGame = gid; screen = 'play';
  const L = g.levels[n-1], b = ad(gid).b;
  S.last = {game:gid, level:n, at:new Date().toISOString(), finished:false}; save();
  P = {gameId:gid, lvl:n, b, idx:0, mistakes:0, coins:0, locked:false, qMiss:false, tapN:0, pos:0, first:null, found:0, moves:0, qs:[], memory:null,
       lStart:activeMs(), lT:new Date().toISOString(), lq:[], done:false, touched:false};
  if (g.kind === 'memory') P.memory = makeMemory(L, b); else P.qs = buildQuestions(g, L, b);
  if (P.qs.length) Pack.preload(P.qs.flatMap(q => [...q.say, ...(q.cheer || [])]));
  setColour(g.color);
  app.innerHTML = `<div class="topbar"><button class="btn iconbtn" data-act="back" aria-label="Back to levels">⬅️</button><div class="progress" id="progress"></div>${coinPill()}</div>
    <div class="prompt"><div class="mascot" id="mascot"><span>🦁</span></div><div class="bubble" id="bubble"></div><button class="btn speak" data-act="speak" aria-label="Read it to me">🔊</button></div>
    <div class="stage" id="stage"></div><div class="options" id="options"></div>`;
  if (P.memory) renderMemory(); else renderQuestion();
}
function renderQuestion(){
  const q = P.qs[P.idx];
  Object.assign(P, {tapN:0, pos:0, qMiss:false, locked:false, qStart:activeMs(), qT:new Date().toISOString(), qFirst:null, qWrong:0, qSpeak:0});
  $('#progress').innerHTML = P.qs.map((_,i) => `<i class="${i<P.idx ? 'done' : i===P.idx ? 'now' : ''}"></i>`).join('');
  $('#bubble').innerHTML = `<span>${q.text}</span>`; setSay(q.say, 'q');
  const stage = $('#stage'), opt = $('#options'); opt.style.display = '';
  stage.style.display = ''; opt.classList.remove('fill');
  if (q.type === 'choice'){
    stage.innerHTML = q.stage;
    if (!q.stage){ stage.style.display = 'none'; opt.classList.add('fill'); }
    opt.innerHTML = q.options.map(o => `<button class="btn opt ${q.optCls}" data-act="ans" data-v="${esc(String(o.value))}">${o.html}</button>`).join('');
  } else if (q.type === 'tap'){
    const cols = q.total<=4 ? q.total : q.total<=8 ? 4 : 6;

    opt.innerHTML = `<div class="tiles">${q.letters.map(l => `<button class="btn opt letter tilel" data-act="spell" data-l="${l}">${l}</button>`).join('')}</div>`;

}
function pulseSpeaker(){ const sp = $('.prompt .speak'); if (!sp) return; sp.classList.remove('pulse'); void sp.offsetWidth; sp.classList.add('pulse'); }
function autoRead(force){

}
function mascot(cls){ const m = $('#mascot'); if (!m) return; m.classList.remove('jump','sad'); void m.offsetWidth; m.classList.add(cls); }
function touch(){ if (!P) return; P.touched = true; if (P.qFirst === null && P.qStart !== undefined) P.qFirst = activeMs() - P.qStart; }

function onAnswer(btn){

}

function correct(el, q){

  const cheer = q.cheer || [];
  Voice.say(cheer.length && coin() ? cheer : [praise(), ...cheer], {kind:'cheer'});
  stat(P.gameId, !P.qMiss); logQuestion(q);

}

function onTapItem(btn){

// memory
function renderMemory(){

  $('#bubble').innerHTML = `<span>${t}</span>`; setSay([say], 'q');

function sizeBoard(){
  const b = $('#board'), stage = $('#stage'); if (!b || !stage || !P || !P.memory) return;
  const n = P.memory.cards.length, W = stage.clientWidth - 10, H = stage.clientHeight - 10, gap = 12;
  let best = {score:-1e9, cols:4, cw:100};
  for (let cols=2; cols<=n; cols++){
    const rows = Math.ceil(n/cols), cw = Math.min((W-(cols-1)*gap)/cols, ((H-(rows-1)*gap)/rows)/1.2);
    const score = cw - (cols*rows - n) * 4;
    if (score > best.score) best = {score, cols, cw};
  }
  b.style.setProperty('--cols', best.cols);
  b.style.setProperty('--cw', Math.max(56, Math.floor(Math.min(best.cw, 175))) + 'px');
}
function onCard(el){
  if (!P || !P.memory || P.locked || el.classList.contains('up') || el.classList.contains('matched')) return;
  P.touched = true;
  const m = P.memory, card = m.cards[+el.dataset.i];

  if (!P.first){ P.first = el; return; }
  const a = P.first, ca = m.cards[+a.dataset.i], p = P;

    setTimeout(() => {

}

// ---------- logging each question and level ----------
function logQuestion(q){
  const ms = activeMs() - P.qStart, idle = ms > ADAPT.idleMs, ok = !P.qMiss;
  const rec = {t:P.qT, g:P.gameId, l:P.lvl, b:P.b, k:q.key, ty:q.listen ? 'listen' : q.type, ms:Math.round(ms), f:Math.round(P.qFirst ?? ms), w:P.qWrong, ok, sp:P.qSpeak, idle};
  LOG.q.push(rec); P.lq.push(rec); if (SESSION) SESSION.q++;
  if (!idle){ const a = ad(P.gameId); a.recent.push({ok, fast: ms <= ADAPT.fastMs(q)}); if (a.recent.length > ADAPT.keep) a.recent.shift(); }
  save(); saveLog();
}
function logLevel(p, done, stars, change){
  const ms = Math.round(activeMs() - p.lStart);
  const rec = {t:p.lT, g:p.gameId, l:p.lvl, b:p.b, ms, n:p.memory ? p.memory.pairs : p.lq.length, w:p.mistakes, st:stars || 0, c:p.coins, done, ch:change || '',
    avg:p.lq.length ? Math.round(p.lq.reduce((a,x) => a + x.ms, 0) / p.lq.length) : 0};
  if (p.memory) rec.mv = p.moves; else rec.ok = p.lq.filter(x => x.ok).length;
  rec.unl = gs(p.gameId).unlocked;
  LOG.levels.push(rec); if (SESSION && done) SESSION.lv++;
  saveLog(); Sync.level(rec);
}
// leaving part-way through still records the time spent
function leaveLevel(){ if (P && !P.done && P.touched){ P.done = true; logLevel(P, false, 0, ''); } }

// end of a level
function starsFor(){
  const g = GAME[P.gameId], m = P.mistakes;
  if (g.kind === 'memory'){ const n = P.memory.pairs; return m <= n+1 ? 3 : m <= 2*n+2 ? 2 : 1; }
  if (g.kind === 'spell') return m <= 1 ? 3 : m <= 4 ? 2 : 1;
  return m === 0 ? 3 : m <= 2 ? 2 : 1;
}
function finishLevel(){
  const p = P, g = GAME[p.gameId], st = gs(p.gameId), stars = starsFor();
  p.done = true;
  const rankBefore = rankOf(totalStars());
  st.stars[p.lvl] = Math.max(st.stars[p.lvl] || 0, stars);
  const last = p.lvl >= g.levels.length, newUnlock = !last && st.unlocked < p.lvl+1;
  if (!last) st.unlocked = Math.max(st.unlocked, p.lvl+1);
  if (g.kind === 'memory'){ const a = ad(p.gameId), dur = activeMs() - p.lStart; a.recent.push({ok:p.mistakes <= p.memory.pairs, fast:dur <= p.memory.pairs*7000}); if (a.recent.length > ADAPT.keep) a.recent.shift(); }
  const change = adaptAfterLevel(p);
  S.last = {game:p.gameId, level:p.lvl, at:new Date().toISOString(), finished:true};
  const bonus = 5 + (stars === 3 ? 3 : 0);
  S.coins += bonus; S.earned += bonus; p.coins += bonus; save();
  logLevel(p, true, stars, change);
  const rankAfter = rankOf(totalStars()), rankUp = rankAfter.name !== rankBefore.name;
  const nb = ad(p.gameId).b;
  const changeHTML = change === 'up' ? `<div class="change">${CHALLENGE[String(nb)].badge} mode! Things get a bit harder now.</div>`
    : change === 'skip' ? `<div class="change">⏭ So quick! Level ${p.lvl+2} is open too!</div>` : '';
  showOverlay(`<div class="panel">
    <div class="bigstars">${[1,2,3].map(i => `<span data-i="${i}">⭐</span>`).join('')}</div>
    <h2>${last && allDone(p.gameId) ? `🏆 All ${g.name} levels done!` : pick(['Level complete!','You did it!','Hooray!'])}</h2>
    <div class="earn">+${p.coins} ${COIN}</div>
    ${newUnlock ? `<div class="unlock">🔓 Level ${p.lvl+1} is open!</div>` : ''}
    ${changeHTML}
    ${rankUp ? `<div class="rankup">${rankAfter.icon} You are now a <b>${rankAfter.name}</b>!</div>` : ''}
    <div class="row">${last ? '' : '<button class="btn bigbtn" data-act="next">Next ▶</button>'}
      <button class="btn bigbtn alt" data-act="again">↻ Again</button><button class="btn bigbtn alt" data-act="levels">Levels</button></div></div>`);
  for (let i=1; i<=stars; i++) setTimeout(() => { const s = $(`.bigstars span[data-i="${i}"]`); if (s){ s.classList.add('on'); Sound.play('star'); } }, 380*i);
  Sound.play(change === 'up' || change === 'skip' ? 'harder' : 'level'); confetti(); updateCoinPill(true);
  const n = named();
  const lines = [n ? `Well done, ${n}!` : PHRASES.wellDone, `You got ${sayN(stars)} star${stars > 1 ? 's' : ''}!`];
  if (rankUp) lines.push(`You are now a ${rankAfter.name}!`);
  if (change === 'up') lines.push(PHRASES.harder); else if (change === 'skip') lines.push(PHRASES.skip);
  Voice.say(lines, {kind:'big'});
  setSay([`You got ${sayN(stars)} star${stars > 1 ? 's' : ''}!`, PHRASES.doneNext]);
}

// ---------- sending progress to the grown-ups' dashboard ----------
// Off until a grown-up pastes a Google script address in grown-ups; the address stays on this iPad.
// Sends game numbers only (levels, difficulty, stars, times, right-first-time counts), never the name or anything typed.
const SYNC_KEY = 'clevercub.sync.v1', OUTBOX_KEY = 'clevercub.outbox.v1', OUTBOX_CAP = 3000;
const SYNC_URL_RE = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]{20,}\/exec$/;
function hashId(s){   // short, stable id: a row sent twice is stored once
  let h1 = 0x811c9dc5, h2 = 0x2545f491;
  for (let i = 0; i < s.length; i++){ const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 16777619); h2 = Math.imul(h2 ^ c, 2246822519) ^ (h2 >>> 13); }
  return (h1 >>> 0).toString(36) + (h2 >>> 0).toString(36);
}
const Sync = {
  cfg:{}, box:[], busy:false, retry:null,
  load(){
    if (QUIET) return;
    try { this.cfg = JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; } catch(e) { this.cfg = {}; }
    try { const b = JSON.parse(localStorage.getItem(OUTBOX_KEY)); this.box = Array.isArray(b) ? b : []; } catch(e) { this.box = []; }
    if (!this.cfg.dev){ this.cfg.dev = hashId(String(Math.random()) + Date.now()); this.saveCfg(); }
  },
  saveCfg(){ if (!QUIET) try { localStorage.setItem(SYNC_KEY, JSON.stringify(this.cfg)); } catch(e) {} },
  saveBox(){ if (this.box.length > OUTBOX_CAP) this.box.splice(0, this.box.length - OUTBOX_CAP); if (!QUIET) try { localStorage.setItem(OUTBOX_KEY, JSON.stringify(this.box)); } catch(e) {} },
  on(){ return !!this.cfg.url; },
  levelRow(rec){
    return {id:hashId(`${this.cfg.dev}|${rec.t}|${rec.g}|${rec.l}|${rec.done}`), k:'level', t:rec.t, day:dayKey(rec.t), g:rec.g, l:rec.l, b:rec.b,
      st:rec.st, n:rec.n, ok:rec.ok ?? null, w:rec.w, ms:rec.ms, done:rec.done, ch:rec.ch || '', unl:rec.unl ?? null};
  },
  level(rec){ if (!this.on()) return; this.box.push(this.levelRow(rec)); this.saveBox(); this.flush(); },
  adj(g, from, to){
    if (!this.on() || from === to) return;
    const t = new Date().toISOString();
    this.box.push({id:hashId(`${this.cfg.dev}|adj|${t}|${g}`), k:'adj', t, day:dayKey(t), g, from, to}); this.saveBox(); this.flush();
  },
  // where she is now: level and difficulty in each game, and minutes and answers per day from this iPad's own log
  snap(){
    sessionTick();
    const want = new Set(), days = {}, qdays = {};
    for (let i = 0; i < 14; i++){ const d = new Date(); d.setDate(d.getDate() - i); want.add(dayKey(d)); }
    LOG.sessions.forEach(x => { const k = dayKey(x.t); if (want.has(k)) days[k] = (days[k] || 0) + x.ms; });
    LOG.q.forEach(x => { const k = dayKey(x.t); if (want.has(k)){ const a = qdays[k] || (qdays[k] = [0, 0]); a[0]++; if (x.ok) a[1]++; } });
    const games = {};
    GAMES.forEach(g => { games[g.id] = {lv:Math.min(gs(g.id).unlocked, g.levels.length), of:g.levels.length, b:ad(g.id).b, stars:gameStars(g.id)}; });
    const lastQ = LOG.q[LOG.q.length - 1], lastL = LOG.levels[LOG.levels.length - 1];
    const lastPlayed = [lastQ && lastQ.t, lastL && lastL.t].filter(Boolean).sort().pop() || null;
    const last = S.last && GAME[S.last.game] ? {game:S.last.game, level:S.last.level, at:S.last.at, finished:!!S.last.finished} : null;
    return {at:new Date().toISOString(), games, days, qdays, coins:S.coins, stars:totalStars(), lastPlayed, last};
  },
  async flush(){
    if (QUIET || !this.on() || this.busy) return;
    this.busy = true; clearTimeout(this.retry);
    const rows = this.box.slice(0, 150);
    const body = JSON.stringify({app:'clevercub', v:1, dev:this.cfg.dev, sentAt:new Date().toISOString(), rows, snap:this.snap()});
    try {
      const res = await fetch(this.cfg.url, {method:'POST', body, keepalive:body.length < 60000, cache:'no-store'});
      const j = await res.json();
      if (!j || !j.ok) throw new Error((j && j.error) || `HTTP ${res.status}`);
      const sent = new Set(rows.map(r => r.id));
      this.box = this.box.filter(r => !sent.has(r.id)); this.saveBox();
      this.cfg.lastOk = new Date().toISOString(); this.cfg.lastErr = ''; this.saveCfg();
      this.busy = false; this.status();
      if (this.box.length) this.flush();
    } catch(e){
      this.cfg.lastErr = String((e && e.message) || e).slice(0, 100); this.cfg.lastErrAt = new Date().toISOString(); this.saveCfg();
      this.busy = false; this.status();
      this.retry = setTimeout(() => this.flush(), 90000);   // offline or Google busy: try again later; rows wait on the iPad
    }
  },
  async test(){
    if (!this.on()) return toast('Add the Google address first');
    const t = new Date().toISOString();
    const body = JSON.stringify({app:'clevercub', v:1, dev:this.cfg.dev, test:true, sentAt:t, rows:[{id:hashId(`${this.cfg.dev}|test|${t}`), k:'test', t, day:dayKey(t)}]});
    toast('Sending a test…');
    try {
      const res = await fetch(this.cfg.url, {method:'POST', body, cache:'no-store'});
      const j = await res.json();
      if (!j || !j.ok) throw new Error((j && j.error) || `HTTP ${res.status}`);
      this.cfg.lastTest = t; this.saveCfg(); toast('Test received by Google ✓');
    } catch(e){ toast(`Test did not arrive: ${String((e && e.message) || e).slice(0, 60)}`); }
    this.status();
  },
  setUrl(v){
    v = String(v || '').trim();
    if (!v){ this.cfg.url = ''; this.box = []; this.saveBox(); this.saveCfg(); toast('Sending is off'); return this.status(); }
    if (!SYNC_URL_RE.test(v)) return toast('That address does not look right. It starts https://script.google.com/macros/s/ and ends /exec');
    if (this.cfg.url === v) return;
    this.cfg.url = v; this.saveCfg();
    const have = new Set(this.box.map(r => r.id));   // send the levels already on this iPad, so the dashboard starts with her history
    LOG.levels.forEach(rec => { const r = this.levelRow(rec); if (!have.has(r.id)) this.box.push(r); });
    this.saveBox(); toast('Saved. Sending now…'); this.flush();
  },
  statusText(){
    if (!this.on()) return 'Off: nothing is sent.';
    const c = this.cfg, parts = [c.lastOk ? `Last sent ${fmtWhen(c.lastOk)}` : 'Not sent yet', this.box.length ? `${this.box.length} waiting to send` : 'nothing waiting'];
    if (c.lastErr && (!c.lastOk || c.lastErrAt > c.lastOk)) parts.push(`the last try did not get through (${c.lastErr}), so it will try again`);
    if (c.lastTest) parts.push(`test received ${fmtWhen(c.lastTest)}`);
    return parts.join(' · ');
  },
  status(){ const el = $('#syncStatus'); if (el) el.textContent = this.statusText(); }
};

// ---------- log export ----------
function csvLog(){
  const head = ['record','date','time','game','level','challenge','type','question','seconds','first_tap_seconds','wrong_taps','right_first_time','stars','mistakes','coins','completed','change','read_aloud_taps','idle','card_turns'];
  const rows = [head];
  const dt = iso => { const d = new Date(iso); return [dayKey(d), `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`]; };
  const sec = ms => (ms/1000).toFixed(1), gname = g => GAME[g] ? GAME[g].name : g;
  LOG.sessions.forEach(x => rows.push(['session', ...dt(x.t), '', '', '', '', '', sec(x.ms), '', '', '', '', '', '', '', '', '', '', '']));
  LOG.levels.forEach(l => rows.push(['level', ...dt(l.t), gname(l.g), l.l, chName(l.b), GAME[l.g] ? GAME[l.g].kind : '', '', sec(l.ms), '', '', '', l.st, l.w, l.c, l.done ? 'yes' : 'no', l.ch, '', '', l.mv ?? '']));
  LOG.q.forEach(q => rows.push(['question', ...dt(q.t), gname(q.g), q.l, chName(q.b), q.ty, q.k, sec(q.ms), sec(q.f), q.w, q.ok ? 'yes' : 'no', '', '', '', '', '', q.sp || 0, q.idle ? 'yes' : 'no', '']));
  return rows.map(r => r.map(v => { const s = String(v ?? ''); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\r\n');
}
async function exportLog(){
  saveLog();
  const name = `clever-cub-log-${dayKey(new Date())}.csv`, blob = new Blob(['﻿' + csvLog()], {type:'text/csv'});
  try {
    const file = new File([blob], name, {type:'text/csv'});
    if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'Clever Cub log'}); return; }
  } catch(e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

// ---------- every line the lion can say (open with ?phrases=1; feeds the voice-pack maker) ----------
function collectPhrases(){
  const set = new Map();
  const add = parts => [].concat(parts || []).forEach(p => { if (p && typeof p === 'string'){ const k = Pack.norm(p); if (!set.has(k)) set.set(k, p.trim()); } });
  add(Object.values(PHRASES)); add(PRAISE); add(TRY); add(PATTERN_CHEERS); add(Object.values(MEMORY_TEXT).flat());
  for (let n=1; n<=24; n++) add(`${N(n)}!`);
  UP.forEach(l => { add(sayL(l)); add(`${sayL(l)}!`); });
  add('Hi!'); add(RANKS.map(r => [`You are a ${r.name}.`, `You are now a ${r.name}!`]).flat());
  add(GAMES.map(g => `${g.name}. Pick a level!`)); for (let n=1; n<=11; n++) add(`Finish level ${n} first!`);
  add(GAMES.map(resumeLine));
  for (let n=1; n<=3; n++) add(`You got ${sayN(n)} star${n > 1 ? 's' : ''}!`);
  for (let n=1; n<=29; n++) add(`You need ${sayN(n)} more coin${n > 1 ? 's' : ''}.`);
  STICKER_SETS.forEach(s => { add(`Do you want this sticker for ${s.price} coins?`); add(`You finished the ${s.name} set!`); s.items.forEach(([,nm]) => { add(`Yay! You got ${aOrAn(nm)}!`); add(`${cap(nm)}!`); }); });
  // combinations the random generators may not hit
  SENTS.forEach(s => EASY3.concat(WORD4).forEach(w => add(s.replace('{w}', w))));
  START_WORDS.forEach(w => { add(`${cap(w)}.`); add(`What letter does ${w} start with?`); add(`${cap(w)} starts with ${sayL(w[0])}!`); add(w); });
  Object.keys(PICS).forEach(w => { add(`${cap(w)}!`); add(`Can you spell ${w}?`); add(w); });
  START_LETTERS.forEach(l => add(`Which picture starts with ${sayL(l)}?`));
  THINGS.forEach(t => { add(`How many ${t.many}?`); ['more','less'].forEach(w => add(`Which side has ${w} ${t.many}?`)); for (let k=1; k<=10; k++) add(`Tap ${sayN(k)} ${k===1 ? t.one : t.many}.`); });
  for (let a=1; a<=10; a++) for (let b=1; b<=10; b++){ add(`${N(a)} plus ${sayN(b)}.`); add(`${N(a)} and ${sayN(b)} make ${sayN(a+b)}!`); }
  TAKE.forEach(th => { for (let n=3; n<=10; n++) add(`${N(n)} ${th.many}.`); for (let k=1; k<=9; k++) add(`${N(k)} ${k===1 ? th.v1 : th.v}.`); });
  for (let n=0; n<=10; n++) add(`${N(n)} left!`);
  for (let n=0; n<=24; n++) add(`Find the number ${sayN(n)}.`);
  for (let s=4; s<=20; s++) add(`${[s,s-1,s-2].map(N).join(', ')}...`);
  for (let s=0; s<23; s++) add(`${UP.slice(s,s+3).map(sayL).join(', ')}...`);
  UP.forEach(l => { add(`Find the letter ${sayL(l)}.`); add(`Find the small letter ${sayL(l)}.`); add(`Find the small letter that goes with big ${sayL(l)}.`); add(`Big ${sayL(l)}, small ${sayL(l)}!`); });
  SIGHT_ALL.forEach(w => { add(`Find the word: ${w}.`); add(`That says ${w}!`); });
  RHYMES.forEach(g => g.forEach(t => { add(`Which one rhymes with ${t}?`); add(`Which word rhymes with ${t}?`); g.forEach(a => { if (a !== t) add(`${cap(t)}, ${a}.`); }); }));
  CATS.forEach(c => add(`Yes! The others are all ${c.name}.`));
  // and whatever the generators actually produce, at every challenge level
  for (const g of GAMES) for (const L of g.levels) for (const b of [-1,0,1,2]) for (let r=0; r<300; r++){
    if (g.kind === 'memory'){ makeMemory(L, b).cards.forEach(c => add(c.say)); continue; }
    const q = g.kind === 'spell' ? qSpell(L, b) : L.gen(b); add(q.say); add(q.cheer);
  }
  return [...set.values()].sort((a,b) => a.localeCompare(b));
}

// ---------- self-test (open with ?selftest=1) ----------
function selfTest(){
  const errs = [], bad = s => typeof s !== 'string' || /undefined|NaN|\[object/.test(s);
  const badParts = p => !Array.isArray(p) || !p.length || p.some(x => bad(x) || !x.trim());
  let n = 0;
  for (const w of new Set([...START_WORDS, ...EASY3, ...EASY3_CLEAR, ...WORD4, ...WORD5, ...RHYMES.flat()])) if (!PICS[w]) errs.push(`no picture for ${w}`);
  for (const w of Object.keys(NEAR)) if (NEAR[w].includes(w) || new Set(NEAR[w]).size !== NEAR[w].length) errs.push(`NEAR list for ${w}`);
  for (const g of GAMES) g.levels.forEach((L, li) => [-1,0,1,2].forEach(b => {
    const tag = `${g.id} L${li+1} b${b}`;
    for (let r=0; r<60; r++){
      try {
        if (g.kind === 'memory'){
          const m = makeMemory(L, b); n++;
          if (m.cards.length !== m.pairs*2 || m.pairs < 2) errs.push(`${tag}: card count`);
          const ids = {}; m.cards.forEach(c => { ids[c.id] = (ids[c.id]||0) + 1; if (!c.h || bad(c.h) || bad(c.say)) errs.push(`${tag}: card face`); });
          if (Object.values(ids).some(v => v !== 2)) errs.push(`${tag}: pair ids`);
          if (new Set(m.cards.map(c => c.h)).size !== (m.kind === 'pics' || m.kind === 'letters' ? m.pairs : m.pairs*2)) errs.push(`${tag}: repeated card faces`);
          continue;
        }
        const q = g.kind === 'spell' ? qSpell(L, b) : L.gen(b); n++;
        if (!q.key) errs.push(`${tag}: no key`);
        if (!q.text || bad(q.text) || badParts(q.say)) errs.push(`${tag}: text/say "${q.text}" ${JSON.stringify(q.say)}`);
        if (q.cheer !== undefined && badParts(q.cheer)) errs.push(`${tag}: cheer ${JSON.stringify(q.cheer)}`);
        if (q.type === 'choice'){
          const vals = q.options.map(o => String(o.value)), htmls = q.options.map(o => o.html);
          if (q.options.length < 2 || q.options.length > 6) errs.push(`${tag}: ${q.options.length} options`);
          if (new Set(vals).size !== vals.length) errs.push(`${tag}: repeated option values ${vals}`);
          if (!q.fixed && new Set(htmls).size !== htmls.length) errs.push(`${tag}: repeated option faces ${htmls}`);
          if (vals.filter(v => v === String(q.answer)).length !== 1) errs.push(`${tag}: answer ${q.answer} not exactly once in ${vals}`);
          q.options.forEach(o => { if (!o.html || bad(String(o.html))) errs.push(`${tag}: option face ${o.html}`); });
          if (bad(q.stage)) errs.push(`${tag}: stage`);
        } else if (q.type === 'tap'){
          if (!(q.target >= 1 && q.total > q.target && q.total <= 12) || !q.emoji) errs.push(`${tag}: tap ${q.target}/${q.total}`);
        } else if (q.type === 'spell'){
          const have = q.letters.slice();
          for (const c of q.word){ const i = have.indexOf(c); if (i < 0){ errs.push(`${tag}: ${q.word} missing ${c}`); break; } have.splice(i,1); }
          if (have.length !== q.extra) errs.push(`${tag}: extra letters ${have}`);
          if (!q.emoji) errs.push(`${tag}: no picture for ${q.word}`);
        } else errs.push(`${tag}: unknown type ${q.type}`);
      } catch(e){ errs.push(`${tag}: ${e.message}`); }
    }
    if (g.kind !== 'memory') for (let r=0; r<10; r++){ const keys = buildQuestions(g, L, b).map(q => q.key); if (new Set(keys).size !== keys.length){ errs.push(`${tag}: repeated question in one level ${keys}`); break; } }
  }));
  // adaptive rules: a perfect, quick level raises the challenge; a poor one lowers it; at the top a level is skipped
  try {
    const p = {gameId:'count', lvl:1};
    ad('count').b = 0; ad('count').recent = Array(5).fill({ok:true, fast:true});
    if (adaptAfterLevel(p) !== 'up' || ad('count').b !== 1) errs.push('adapt: did not go up');
    ad('count').recent = Array(5).fill({ok:false, fast:true});
    if (adaptAfterLevel(p) !== 'down' || ad('count').b !== 0) errs.push('adapt: did not go down');
    ad('count').b = 2; ad('count').recent = Array(5).fill({ok:true, fast:true}); gs('count').unlocked = 1;
    if (adaptAfterLevel(p) !== 'skip' || gs('count').unlocked !== 3) errs.push('adapt: did not skip');
    ad('count').recent = Array(5).fill({ok:true, fast:false});
    if (adaptAfterLevel(p) !== '') errs.push('adapt: slow but right should not change');
    S.adapt = {}; S.games = {};
  } catch(e){ errs.push('adapt: ' + e.message); }
  // drive every screen and every level once, answering everything right
  let screens = 0;
  try {
    sessionStart();
    showSplash(); showHome(); showStickers(); showParents(); screens += 4;
    for (const g of GAMES){
      showLevels(g.id); screens++;
      g.levels.forEach((_, li) => {
        startLevel(g.id, li+1); screens++;
        if (P.memory){
          if ($$('.card').length !== P.memory.cards.length) errs.push(`${g.id} L${li+1}: board render`);
        } else {
          for (let i=0; i<P.qs.length; i++){
            P.idx = i; renderQuestion();
            const q = P.qs[i];
            if (q.type === 'choice' && $$('.opt').length !== q.options.length) errs.push(`${g.id} L${li+1}: option render`);
            if (q.type === 'spell' && $$('.tilel').length !== q.letters.length) errs.push(`${g.id} L${li+1}: tile render`);
            if (q.type === 'tap' && $$('.tapitem').length !== q.total) errs.push(`${g.id} L${li+1}: tap render`);
            P.touched = true; logQuestion(q);
          }
        }
        finishLevel(); closeOverlay();
      });
    }
    if (LOG.levels.length < 70 || LOG.q.length < 290) errs.push(`log: ${LOG.levels.length} levels, ${LOG.q.length} questions`);
    // leaving part-way logs an unfinished level
    startLevel('count', 1); P.touched = true; const before = LOG.levels.length; showHome();
    if (LOG.levels.length !== before + 1 || LOG.levels[LOG.levels.length-1].done !== false) errs.push('log: early exit not recorded');
    const csv = csvLog(); if (csv.split('\r\n').length < LOG.q.length + LOG.levels.length + 1 || /undefined|NaN/.test(csv)) errs.push('csv export');
    showParents(); screens++;
    S.coins = 100; showStickers(); buySticker('🐶'); if (!S.stickers.includes('🐶') || S.coins !== 90) errs.push('sticker purchase');
    closeOverlay(); showHome(); screens++;
    if (rankOf(totalStars()).name === 'Little Cub') errs.push('rank did not rise after finishing every level');
  } catch(e){ errs.push('screens: ' + e.message + ' ' + (e.stack || '').split('\n')[1]); }
  // dashboard sync: rows come from the log, ids are stable, the name never goes out, nothing is sent during a test
  try {
    const keepName = S.settings.name; S.settings.name = 'Zebedee';
    Sync.cfg = {url:'https://script.google.com/macros/s/TESTTESTTESTTESTTESTTESTTEST/exec', dev:'test0001'}; Sync.box = [];
    startLevel('count', 1);
    for (let i=0; i<P.qs.length; i++){ P.idx = i; renderQuestion(); P.touched = true; logQuestion(P.qs[i]); }
    finishLevel(); closeOverlay();
    ad('count').b = 0; changeChallenge('count', 1); screens++;
    const rows = Sync.box, r0 = rows[0] || {};
    if (rows.length !== 2 || r0.k !== 'level' || rows[1].k !== 'adj') errs.push(`sync: queued ${JSON.stringify(rows.map(r => r.k))}`);
    if (!(r0.n > 0) || r0.ok !== r0.n || r0.done !== true || !/^[a-z0-9]{6,}$/.test(r0.id) || !(r0.unl >= 2)) errs.push(`sync: level row ${JSON.stringify(r0)}`);
    if (Sync.levelRow(LOG.levels[LOG.levels.length-1]).id !== r0.id) errs.push('sync: id not stable');
    const sn = Sync.snap(), body = JSON.stringify({app:'clevercub', dev:Sync.cfg.dev, rows, snap:sn});
    if (/zebedee/i.test(body)) errs.push('sync: the name is in what would be sent');
    if (body.includes('\\')) errs.push('sync: backslash in what would be sent');
    if (!sn.games.count || sn.games.count.of !== GAME.count.levels.length || sn.games.count.b !== 1 || !Object.keys(sn.qdays).length) errs.push(`sync: snapshot ${JSON.stringify(sn.games.count)}`);
    Sync.flush(); if (Sync.busy) errs.push('sync: tried to send during the self-test');
    showParents(); if (!$('#pSync') || !$('#syncStatus')) errs.push('sync: grown-ups card missing');
    Sync.setUrl('not an address'); if (Sync.cfg.url !== 'https://script.google.com/macros/s/TESTTESTTESTTESTTESTTESTTEST/exec') errs.push('sync: accepted a bad address');
    if (!sn.last || !sn.last.game) errs.push('sync: snapshot has no left-off level');
    Sync.cfg = {}; Sync.box = []; S.settings.name = keepName; showHome();
  } catch(e){ errs.push('sync: ' + e.message + ' ' + (e.stack || '').split('\n')[1]); }
  // where she left off: a finished level resumes at the next one, an unfinished one resumes itself
  try {
    S.last = null; showHome(); if ($('.resume')) errs.push('resume: card shown with no record');
    startLevel('letters', 2); for (let i=0; i<P.qs.length; i++){ P.idx = i; renderQuestion(); P.touched = true; logQuestion(P.qs[i]); } finishLevel(); closeOverlay();
    if (!S.last || S.last.game !== 'letters' || S.last.level !== 2 || !S.last.finished) errs.push(`resume: after finishing ${JSON.stringify(S.last)}`);
    showHome(); screens++; const card = $('.resume');
    if (!card || !/Letters · Level 2/.test(card.textContent) || !/Keep going/.test(card.textContent)) errs.push(`resume: card "${card ? card.textContent.trim() : ''}"`);
    if (!currentSay.includes(resumeLine(GAME.letters))) errs.push('resume: not in the spoken home lines');
    resumeLast(); if (!P || P.gameId !== 'letters' || P.lvl !== 3) errs.push(`resume: opened ${P && P.gameId} ${P && P.lvl}, wanted letters 3`);
    P.touched = true; showHome();
    if (!S.last || S.last.level !== 3 || S.last.finished) errs.push(`resume: after leaving early ${JSON.stringify(S.last)}`);
    resumeLast(); if (!P || P.lvl !== 3) errs.push('resume: did not reopen the unfinished level');
    showHome();
    const lastG = GAME.spell, top = lastG.levels.length; gs('spell').unlocked = top; S.last = {game:'spell', level:top, at:new Date().toISOString(), finished:true};
    showHome(); if (!/Play again/.test(($('.resume') || {}).textContent || '')) errs.push('resume: last level should say Play again');
    resumeLast(); if (screen !== 'levels') errs.push('resume: last level should open the levels screen');
    if (!collectPhrases().includes(resumeLine(GAME.count))) errs.push('resume: line missing from the voice list');
    S.last = null; showHome();
  } catch(e){ errs.push('resume: ' + e.message + ' ' + (e.stack || '').split('\n')[1]); }
  const phrases = collectPhrases();
  const out = document.createElement('pre'); out.id = 'selftest';
  out.textContent = JSON.stringify({questionsChecked:n, screensDrawn:screens, phrases:phrases.length, loggedLevels:LOG.levels.length, loggedQuestions:LOG.q.length, errorCount:errs.length, errors:errs.slice(0,40)});
  document.body.appendChild(out);
  document.title = errs.length ? `SELFTEST FAIL ${errs.length}` : `SELFTEST PASS ${n}`;
}

// ---------- start ----------
Sync.load();
Voice.init();
if (TEST) selfTest();
else if (PHRASE_DUMP){ const out = document.createElement('pre'); out.id = 'phrases'; out.textContent = JSON.stringify(collectPhrases()); document.body.appendChild(out); document.title = 'PHRASES'; }
else { Pack.load(); showSplash(); }
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !QUIET){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
